<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Loaded Chunks Map — see which chunks stay loaded in your Minecraft world</title>
        <meta
            name="description"
            content="Drop your Minecraft Java world folder and see which chunks stay loaded: spawn chunks, /forceload and the area around each player. All in your browser, nothing uploaded."
        />
        <meta name="theme-color" content="#070a11" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b0f17'/><rect x='6' y='6' width='9' height='9' fill='%234ade80'/><rect x='17' y='6' width='9' height='9' fill='%2360a5fa'/><rect x='6' y='17' width='9' height='9' fill='%23c084fc'/><rect x='17' y='17' width='9' height='9' fill='%231c2433'/></svg>"
        />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/hero.css" />
        <link rel="stylesheet" href="css/panel.css" />
        <link rel="stylesheet" href="css/map.css" />
        <script>
            /* Tema antes del primer pintado, para que no haya destello. */
            (function () {
                try {
                    var t = localStorage.getItem('lcm.theme');
                    if (t !== 'light' && t !== 'dark') {
                        t =
                            window.matchMedia &&
                            window.matchMedia('(prefers-color-scheme: light)').matches
                                ? 'light'
                                : 'dark';
                    }
                    document.documentElement.setAttribute('data-theme', t);
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div class="topbar">
            <button
                id="themeBtn"
                class="icon-btn"
                type="button"
                data-i18n-title="settings.theme.toLight"
                data-i18n-aria="settings.theme.toLight"
            >
                <svg
                    id="themeIcon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                >
                    <circle cx="12" cy="12" r="4"></circle>
                    <path
                        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                    ></path>
                </svg>
            </button>
            <select id="langSelect" class="lang-select" data-i18n-aria="settings.language"></select>
        </div>

        <header id="hero" class="hero">
            <div class="wrap">
                <div class="badge" data-i18n="hero.badge"></div>
                <h1 data-i18n="hero.title"></h1>
                <p class="lead" data-i18n="hero.lead"></p>

                <div id="drop" class="drop">
                    <input type="file" id="dirInput" webkitdirectory directory multiple hidden />
                    <div class="drop-inner">
                        <svg
                            viewBox="0 0 24 24"
                            width="34"
                            height="34"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                        >
                            <path
                                d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h9A1.5 1.5 0 0 1 21 10v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z"
                            />
                        </svg>
                        <p data-i18n="drop.title"></p>
                        <div class="btns">
                            <button
                                id="pickDir"
                                class="btn primary"
                                data-i18n="drop.pickDir"
                            ></button>
                        </div>
                        <p class="hint" id="dropHint" data-i18n="drop.hint"></p>
                    </div>
                </div>

                <details class="where">
                    <summary data-i18n="where.summary"></summary>
                    <ul>
                        <li data-i18n="where.win"></li>
                        <li data-i18n="where.mac"></li>
                        <li data-i18n="where.linux"></li>
                        <li data-i18n="where.server"></li>
                    </ul>
                </details>
            </div>
        </header>

        <main id="app" hidden>
            <div class="app-grid">
                <aside class="panel">
                    <section class="card" id="worldCard">
                        <h2 data-i18n="card.world"></h2>
                        <dl id="worldInfo"></dl>
                    </section>

                    <section class="card">
                        <h2 data-i18n="card.sources"></h2>
                        <label class="chk"
                            ><input type="checkbox" id="srcSpawn" checked /><span
                                class="dot spawn"
                            ></span>
                            <span data-i18n="src.spawn"></span
                        ></label>
                        <p class="note" id="spawnNote"></p>
                        <label class="chk sub"
                            ><input type="checkbox" id="spawnManual" />
                            <span data-i18n="spawn.manual"></span
                        ></label>
                        <label class="range" id="spawnRadiusRow" hidden>
                            <span data-i18n="ctl.spawnRadius"></span>
                            <output id="spawnRadiusOut"></output>
                            <input type="range" id="spawnRadius" min="0" max="32" step="1" />
                        </label>

                        <label class="chk"
                            ><input type="checkbox" id="srcPlayers" checked /><span
                                class="dot player"
                            ></span>
                            <span data-i18n="src.players"></span
                        ></label>
                        <p class="note" id="playersNote" hidden></p>
                        <label class="range">
                            <span data-i18n="ctl.simDist"></span> <output id="simDistOut"></output>
                            <input type="range" id="simDist" min="2" max="32" step="1" value="10" />
                        </label>
                        <p class="note" data-i18n="note.simDist"></p>

                        <label class="chk"
                            ><input type="checkbox" id="srcForce" checked /><span
                                class="dot force"
                            ></span>
                            <span data-i18n="src.force"></span
                        ></label>

                        <label class="chk"
                            ><input type="checkbox" id="srcLoaders" checked /><span
                                class="dot loader"
                            ></span>
                            <span data-i18n="src.loaders"></span
                        ></label>
                        <p class="note" id="loaderNote"></p>
                        <label class="range" id="loaderRadiusRow">
                            <span data-i18n="ctl.loaderRadius"></span>
                            <output id="loaderRadiusOut"></output>
                            <input
                                type="range"
                                id="loaderRadius"
                                min="0"
                                max="8"
                                step="1"
                                value="3"
                            />
                        </label>
                    </section>

                    <section class="card">
                        <h2 data-i18n="card.layers"></h2>
                        <select id="dimSelect"></select>
                        <select id="terrainMode" class="mode-select">
                            <option value="blocks" data-i18n="mode.blocks"></option>
                            <option value="biomes" data-i18n="mode.biomes"></option>
                        </select>
                        <p class="note" id="terrainNote" hidden></p>

                        <div class="dropdown dropdown-side mode-dropdown" id="structMenu">
                            <button
                                id="structBtn"
                                class="btn small"
                                type="button"
                                aria-haspopup="true"
                                aria-expanded="false"
                                aria-controls="structPanel"
                            >
                                <span data-i18n="btn.structures"></span>
                                <span class="caret" aria-hidden="true"></span>
                            </button>
                            <div class="dropdown-panel" id="structPanel" hidden>
                                <label class="chk struct-all"
                                    ><input type="checkbox" id="structAll" />
                                    <span data-i18n="struct.all"></span
                                ></label>
                                <p
                                    class="note struct-note"
                                    id="structNote"
                                    data-i18n="struct.hint"
                                ></p>
                                <div class="struct-list" id="structList"></div>
                            </div>
                        </div>

                        <label class="chk"
                            ><input type="checkbox" id="layerLoaded" checked />
                            <span data-i18n="layer.loaded"></span
                        ></label>
                        <label class="chk"
                            ><input type="checkbox" id="layerMarkers" checked />
                            <span data-i18n="layer.markers"></span
                        ></label>
                        <label class="chk"
                            ><input type="checkbox" id="layerGrid" checked />
                            <span data-i18n="layer.grid"></span
                        ></label>
                    </section>

                    <details class="card fold" id="summaryCard">
                        <summary>
                            <h2 data-i18n="card.summary"></h2>
                            <span class="caret" aria-hidden="true"></span>
                        </summary>
                        <dl id="statsInfo"></dl>
                    </details>

                    <section class="card" id="warnCard" hidden>
                        <h2 data-i18n="card.warnings"></h2>
                        <ul id="warnList"></ul>
                    </section>

                    <button id="reset" class="btn ghost wide" data-i18n="btn.reset"></button>
                </aside>

                <div class="map-wrap">
                    <div class="map-toolbar">
                        <div class="tb-side tb-left">
                            <select
                                id="gotoPlayer"
                                class="small"
                                data-i18n-aria="btn.goto"
                            ></select>
                            <button id="png" class="btn small" data-i18n="btn.png"></button>
                        </div>

                        <div class="tb-center">
                            <!--
                                No es un botón: el seguimiento arranca solo en
                                cuanto hay una carpeta que se pueda releer. Esto
                                solo informa, y por eso es un aria-live.
                            -->
                            <div id="liveStatus" class="live-status" role="status" aria-live="polite">
                                <span class="live-dot" aria-hidden="true"></span>
                                <span id="liveLabel"></span>
                            </div>
                            <p class="live-note" id="liveNote"></p>
                        </div>

                        <div class="tb-side tb-right">
                            <span class="legend">
                                <span
                                    ><i class="sw spawn"></i><span data-i18n="legend.spawn"></span
                                ></span>
                                <span
                                    ><i class="sw player"></i><span data-i18n="legend.player"></span
                                ></span>
                                <span
                                    ><i class="sw force"></i><span data-i18n="legend.force"></span
                                ></span>
                                <span
                                    ><i class="sw loader"></i
                                    ><span data-i18n="legend.loader"></span
                                ></span>
                                <span
                                    ><i class="sw terrain"></i
                                    ><span data-i18n="legend.terrain"></span
                                ></span>
                                <span
                                    ><i class="sw wborder"></i
                                    ><span data-i18n="legend.border"></span
                                ></span>
                            </span>
                        </div>
                    </div>
                    <div class="canvas-holder">
                        <canvas id="map"></canvas>
                        <div class="map-status">
                            <span id="terrainStatus" class="terrain-status" hidden>
                                <i class="spin"></i>
                                <span id="terrainStatusText"></span>
                                <span class="meter"><i id="terrainStatusBar"></i></span>
                            </span>
                            <span id="structStatus" class="terrain-status" hidden>
                                <i class="spin"></i>
                                <span id="structStatusText"></span>
                                <span class="meter"><i id="structStatusBar"></i></span>
                            </span>
                        </div>
                        <div id="tooltip" class="tooltip" hidden></div>
                    </div>
                    <p class="disclaimer" data-i18n="disclaimer"></p>
                </div>
            </div>
        </main>

        <div id="loading" class="loading" hidden>
            <div class="loading-box">
                <div class="bar"><div id="bar" class="bar-fill"></div></div>
                <p id="loadingText"></p>
            </div>
        </div>

        <section class="explain wrap">
            <h2 data-i18n="explain.title"></h2>
            <div class="cols">
                <article>
                    <h3 data-i18n="explain.spawn.h"></h3>
                    <p data-i18n="explain.spawn.p"></p>
                </article>
                <article>
                    <h3 data-i18n="explain.force.h"></h3>
                    <p data-i18n="explain.force.p"></p>
                </article>
                <article>
                    <h3 data-i18n="explain.players.h"></h3>
                    <p data-i18n="explain.players.p"></p>
                </article>
                <article>
                    <h3 data-i18n="explain.loaders.h"></h3>
                    <p data-i18n="explain.loaders.p"></p>
                </article>
                <article>
                    <h3 data-i18n="explain.terrain.h"></h3>
                    <p data-i18n="explain.terrain.p"></p>
                </article>
                <article>
                    <h3 data-i18n="explain.struct.h"></h3>
                    <p data-i18n="explain.struct.p"></p>
                </article>
            </div>
            <p class="fine" data-i18n="explain.fine"></p>
        </section>

        <footer class="foot wrap">
            <p data-i18n="foot"></p>
        </footer>

        <!-- Base: idioma y tema, que usa todo lo demás. -->
        <script src="js/core/i18n.js"></script>
        <script src="js/core/theme.js"></script>

        <!-- Lectura del save y modelo de chunks. -->
        <script src="js/data/nbt.js"></script>
        <script src="js/data/world.js"></script>
        <script src="js/data/chunks.js"></script>
        <script src="js/data/live.js"></script>

        <!-- Pintado del mapa. Los colores de bloques y biomas no hacen falta
             aquí: viven dentro de los workers, que son quienes los usan. -->
        <script src="js/render/structure-icons.js"></script>
        <script src="js/render/terrain.js"></script>
        <script src="js/render/structures.js"></script>
        <script src="js/render/map.js"></script>

        <!-- Interfaz. El estado compartido va primero: los demás se cuelgan de él. -->
        <script src="js/ui/format.js"></script>
        <script src="js/ui/app.js"></script>
        <script src="js/ui/panel.js"></script>
        <script src="js/ui/structures-menu.js"></script>
        <script src="js/ui/live-status.js"></script>
        <script src="js/ui/files.js"></script>
        <script src="js/ui/settings.js"></script>
        <script src="js/ui/main.js"></script>
    </body>
</html>
